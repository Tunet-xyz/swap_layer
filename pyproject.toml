[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swap_layer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/mcp", "/requirements", "/.github", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md", "/VERSIONING.md", "/CONTRIBUTING.md", "/AGENTS.md", "/CLAUDE.md", "/pyproject.toml"]

[project]
name = "SwapLayer"
version = "1.0.0"
description = "One Python interface for billing, email, SMS, storage, identity, and verification providers, with Django and FastAPI integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["python", "django", "fastapi", "saas", "providers", "stripe", "paypal", "square", "twilio", "aws", "infrastructure", "anti-vendor-lock-in"]
authors = [
  { name = "Tunet Ltd", email = "alex@tunet.xyz" },
]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Intended Audience :: Developers",
]
dependencies = [
  "pydantic>=2.14.3,<3",
  "requests>=2.28,<3",
  "tenacity>=9.2.1",
]

[project.urls]
Homepage = "https://github.com/Tunet-xyz/swap_layer"
Product = "https://www.tunet.xyz/engineering/swap-layer/"
Documentation = "https://github.com/Tunet-xyz/swap_layer/blob/main/docs/README.md"
Repository = "https://github.com/Tunet-xyz/swap_layer"
Issues = "https://github.com/Tunet-xyz/swap_layer/issues"
Changelog = "https://github.com/Tunet-xyz/swap_layer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
django = ["Django>=5.2.19,<7"]
fastapi = ["fastapi>=0.162.0"]
stripe = ["stripe>=16.1,<17"]
paypal = []
square = []
aws = ["boto3>=1.43.126", "django-storages[s3]>=1.14.6"]
azure = ["azure-storage-blob>=12.31.1", "django-storages[azure]>=1.14.6"]
email = ["Django>=5.2.19,<7", "django-anymail>=15.2,<16"]
gcs = ["google-cloud-storage>=3.17.1,<4"]
sms = ["twilio>=9.13.0,<10"]
identity = ["Django>=5.2.19,<7", "workos>=10.8.0,<11", "Authlib>=1.9.5,<2"]
mcp = ["mcp>=2.3.0,<3"]
all = [
  "Django>=5.2.19,<7",
  "fastapi>=0.162.0",
  "stripe>=16.1,<17",
  "boto3>=1.43.126",
  "django-storages[s3,azure]>=1.14.6",
  "django-anymail>=15.2,<16",
  "azure-storage-blob>=12.31.1,<13",
  "google-cloud-storage>=3.17.1,<4",
  "twilio>=9.13.0,<10",
  "workos>=10.8.0,<11",
  "Authlib>=1.9.5,<2",
  "tenacity>=9.2.1",
  "mcp>=2.3.0,<3",
]
dev = [
  "Django>=5.2.19,<7",
  "fastapi>=0.162.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-asyncio>=1.4.1.post1",
  "mypy>=2.4.1",
  "ruff>=0.17.4",
  "types-requests>=2.33.0.20261030",
  "django-stubs>=6.0.9",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
]

[project.scripts]
swaplayer-mcp = "swap_layer.mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.conftest"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
  "B904",  # Within except clause, raise with from err (too verbose for this codebase)
]

[tool.ruff.lint.isort]
known-first-party = ["swap_layer"]

[tool.coverage.run]
source = ["src/swap_layer"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 45
show_missing = true
