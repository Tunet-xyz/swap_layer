[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swap_layer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/mcp", "/examples", "/tools", "/requirements", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md", "/VERSIONING.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/pyproject.toml"]

[project]
name = "SwapLayer"
version = "1.0.0"
description = "One Python interface for billing, email, SMS, storage, identity, and verification providers, with Django and FastAPI integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["anti-vendor-lock-in", "aws", "django", "fastapi", "infrastructure", "mcp", "paypal", "providers", "saas", "square", "stripe", "twilio"]
authors = [
  { name = "Tunet Ltd", email = "alex@tunet.xyz" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.1",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2,<3",
  "requests>=2.28,<3",
  "tenacity>=8.0.0",
]

[project.optional-dependencies]
django = ["Django>=4.2,<7"]
fastapi = ["fastapi>=0.100.0"]
stripe = ["stripe>=16.1,<17"]
paypal = []
square = []
aws = ["boto3>=1.26.0", "django-storages[s3]>=1.13"]
azure = ["azure-storage-blob>=12.0.0", "django-storages[azure]>=1.13"]
email = ["Django>=4.2,<7", "django-anymail>=10.0,<16"]
gcs = ["google-cloud-storage>=3,<4"]
sms = ["twilio>=9.12,<10"]
identity = ["Django>=4.2,<7", "workos>=10.7,<11", "Authlib>=1.9.4,<2"]
mcp = ["mcp>=1.30,<2"]
all = [
  "Django>=4.2,<7",
  "fastapi>=0.100.0",
  "stripe>=16.1,<17",
  "boto3>=1.26.0",
  "django-storages[s3,azure]>=1.13",
  "django-anymail>=10.0,<16",
  "azure-storage-blob>=12,<13",
  "google-cloud-storage>=3,<4",
  "twilio>=9.12,<10",
  "workos>=10.7,<11",
  "Authlib>=1.9.4,<2",
  "tenacity>=8.0.0",
  "mcp>=1.30,<2",
]
dev = [
  "Django>=4.2,<7",
  "fastapi>=0.100.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.21.0",
  "mypy>=1.0.0",
  "ruff>=0.1.0",
  "types-requests>=2.31.0",
  "django-stubs>=4.2.0",
  "bandit>=1.9",
  "pip-audit>=2.10",
]

[project.urls]
Homepage = "https://github.com/Tunet-xyz/swap_layer"
Product = "https://www.tunet.xyz/engineering/swap-layer/"
Documentation = "https://github.com/Tunet-xyz/swap_layer/blob/main/docs/README.md"
Repository = "https://github.com/Tunet-xyz/swap_layer"
Issues = "https://github.com/Tunet-xyz/swap_layer/issues"
Changelog = "https://github.com/Tunet-xyz/swap_layer/blob/main/CHANGELOG.md"

[project.scripts]
swaplayer-mcp = "swap_layer.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
packages = ["swap_layer"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
  "B904",  # Within except clause, raise with from err (too verbose for this codebase)
]

[tool.ruff.lint.isort]
known-first-party = ["swap_layer"]

[tool.coverage.run]
source = ["swap_layer"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 45
show_missing = true
