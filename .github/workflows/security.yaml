name: Security

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - run: python -m pip install ".[all,dev]"
      - name: Static security analysis
        run: python -m bandit -r src
      - name: Dependency vulnerability audit
        run: |
          python -m pip freeze --exclude SwapLayer > audit-requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps -r audit-requirements.txt
