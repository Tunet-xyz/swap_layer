name: Security

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: python -m pip install ".[all,dev]"
      - run: python -m bandit -r src
      - name: Audit third-party dependencies
        run: |
          python -m pip freeze --exclude SwapLayer > audit-requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps -r audit-requirements.txt
