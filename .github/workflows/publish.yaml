name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - name: Require main or the matching version tag
        env: {RELEASE_REF: "${{ github.ref }}"}
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          case "$RELEASE_REF" in
            refs/heads/main|"refs/tags/v$version") ;;
            *) echo "::error::Choose main or v$version."; exit 1 ;;
          esac
      - run: python -m pip install --require-hashes -r requirements/build.txt
      - run: python -m pip install ".[all,dev]"
      - name: Verify release source
        run: |
          python -m ruff check src tests
          python -m mypy src/swap_layer
          python -m bandit -r src
          AWS_EC2_METADATA_DISABLED=true python -m pytest --cov=swap_layer --cov-branch
      - name: Build and inspect the distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation --outdir dist/packages
          python -m twine check --strict dist/packages/*
          sha256sum dist/packages/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: release-distributions, path: dist/, if-no-files-found: error}

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/SwapLayer
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: {packages-dir: dist/packages, print-hash: true}
