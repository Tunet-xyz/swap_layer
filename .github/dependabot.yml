version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    # Keep the declared floors (this is a library): a release inside a range
    # needs no change, and one outside it gets its own pull request. Version
    # updates skip the uv build lock and the floor pins, which change by hand.
    versioning-strategy: increase-if-necessary
    exclude-paths: [requirements/build.in, requirements/build.txt, requirements/minimum.txt]
    commit-message: {prefix: build, include: scope}
    groups:
      python-dependencies: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      # The MCP server uses the SDK 1.x decorator API, which SDK 2 removed.
      - {dependency-name: mcp, versions: [">=2"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups:
      workflow-actions: {patterns: ["*"]}
