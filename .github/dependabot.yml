version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups:
      python-dependencies: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups:
      workflow-actions: {patterns: ["*"]}
